services:
  supermonitor:
    build:
      context: .
      args:
        VERSION: ${SUPMON_VERSION:-v0.10.0}
    image: ghcr.io/denght123/supermonitor:${SUPMON_VERSION:-v0.10.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SUPMON_LISTEN: 0.0.0.0:8080
      SUPMON_DATA_DIR: /app/data
      SUPMON_ENVIRONMENT: docker
      SUPMON_SYNC_TIMEOUT: ${SUPMON_SYNC_TIMEOUT:-10m}
      SUPMON_ADMIN_PASSWORD: ${SUPMON_ADMIN_PASSWORD:-}
      SUPMON_ALLOW_INSECURE_REMOTE: ${SUPMON_ALLOW_INSECURE_REMOTE:-false}
      SUPMON_PROXY_URL: ${SUPMON_PROXY_URL:-}
      SUPMON_LOG_FILE: ${SUPMON_LOG_FILE:-}
      SUPMON_GEMINI_OAUTH_CLIENT_ID: ${SUPMON_GEMINI_OAUTH_CLIENT_ID:-}
      SUPMON_GEMINI_OAUTH_CLIENT_SECRET: ${SUPMON_GEMINI_OAUTH_CLIENT_SECRET:-}
    volumes:
      - supermonitor-data:/app/data

volumes:
  supermonitor-data:
