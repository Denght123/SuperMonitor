openapi: 3.1.0
info:
  title: SuperMonitor API
  version: 0.8.0
  description: Monitoring-only API. It intentionally exposes no model proxy endpoints.
servers:
  - url: /api/v1
paths:
  /overview:
    get:
      operationId: getOverview
      responses:
        "200":
          description: Current monitoring overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /providers:
    get:
      operationId: listProviders
      responses:
        "200":
          description: Provider adapter status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
  /refresh:
    post:
      operationId: refreshAll
      responses:
        "202":
          description: Refresh completed for connected real accounts
        "409":
          description: A manual or scheduled account refresh is already running
  /sync/status:
    get:
      operationId: getAccountSyncStatus
      responses:
        "200":
          description: Browser-independent account refresh scheduler status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSyncStatus"
  /providers/{providerID}/accounts/import:
    post:
      operationId: importProviderCredential
      parameters:
        - in: path
          name: providerID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                alias: { type: string }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Credential imported and live quota fetched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSummary" }
  /providers/{providerID}/accounts/secret:
    post:
      operationId: connectProviderSecret
      parameters:
        - in: path
          name: providerID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                alias: { type: string }
                secret: { type: string }
      responses:
        "201":
          description: Secret verified and live quota fetched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSummary" }
  /providers/{providerID}/accounts/custom:
    post:
      operationId: connectCustomQuotaEndpoint
      parameters:
        - in: path
          name: providerID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, method, authType, valuePath, label, unit, kind]
              properties:
                alias: { type: string }
                endpoint: { type: string, format: uri }
                method: { type: string, enum: [GET, POST] }
                authType: { type: string, enum: [bearer, header, cookie, none] }
                headerName: { type: string }
                headerPrefix: { type: string }
                secret: { type: string }
                requestBody: { type: string }
                valuePath: { type: string }
                totalPath: { type: string }
                resetAtPath: { type: string }
                expiresAtPath: { type: string }
                label: { type: string }
                unit: { type: string }
                kind: { type: string }
      responses:
        "201":
          description: Endpoint authenticated, response mapping verified, and account saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSummary" }
  /providers/{providerID}/oauth:
    post:
      operationId: startProviderOAuth
      parameters:
        - in: path
          name: providerID
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                alias: { type: string }
      responses:
        "202":
          description: Official provider OAuth login started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLoginSession" }
  /providers/{providerID}/oauth/{sessionID}:
    get:
      operationId: getProviderOAuth
      parameters:
        - in: path
          name: providerID
          required: true
          schema: { type: string }
        - in: path
          name: sessionID
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OAuth login status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLoginSession" }
  /providers/codex/accounts/import:
    post:
      operationId: importCodexAccount
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                alias: { type: string }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Codex account imported and quota fetched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSummary" }
  /providers/codex/device-login:
    post:
      operationId: startCodexDeviceLogin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                alias: { type: string }
      responses:
        "202":
          description: Official Codex device login started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLoginSession" }
  /providers/codex/device-login/{sessionID}:
    get:
      operationId: getCodexDeviceLogin
      parameters:
        - in: path
          name: sessionID
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Device login status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLoginSession" }
  /accounts/{accountID}/refresh:
    post:
      operationId: refreshAccount
      parameters:
        - in: path
          name: accountID
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Refreshed account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSummary" }
  /accounts/{accountID}:
    delete:
      operationId: deleteAccount
      parameters:
        - in: path
          name: accountID
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Account, encrypted credential, and cached quota windows deleted
        "404":
          description: Account does not exist or was already deleted
  /notifications/channels:
    get:
      operationId: listNotificationChannels
      responses:
        "200":
          description: Notification channel summaries without credentials
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationChannel" }
    post:
      operationId: createNotificationChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelInput" }
      responses:
        "201":
          description: Encrypted notification channel created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
  /notifications/channels/{channelID}:
    delete:
      operationId: deleteNotificationChannel
      parameters:
        - in: path
          name: channelID
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Notification channel and delivery receipts deleted
  /notifications/channels/{channelID}/test:
    post:
      operationId: testNotificationChannel
      parameters:
        - in: path
          name: channelID
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Test notification accepted by the configured channel
  /notifications/policy:
    get:
      operationId: getNotificationPolicy
      responses:
        "200":
          description: Active local notification and activity policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPolicy" }
  /notifications/evaluate:
    post:
      operationId: evaluateNotifications
      responses:
        "200":
          description: Quota alerts, reset reminders, and verified activities evaluated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationEvaluation" }
  /activities:
    get:
      operationId: listActivities
      responses:
        "200":
          description: Real activities available for connected accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Activity" }
                  warning:
                    type: string
                    description: Present when one or more connected activity accounts could not be checked
  /activities/{accountID}/{activityID}:
    post:
      operationId: runActivity
      parameters:
        - in: path
          name: accountID
          required: true
          schema: { type: string }
        - in: path
          name: activityID
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activity executed and account quota refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
  /events:
    get:
      operationId: subscribeEvents
      responses:
        "200":
          description: Server-sent event stream
components:
  schemas:
    AccountSyncStatus:
      type: object
      required: [enabled, intervalSeconds, timeoutSeconds, startupDelaySeconds, running, lastResult, activityMode]
      properties:
        enabled: { type: boolean }
        intervalSeconds: { type: integer, format: int64 }
        timeoutSeconds: { type: integer, format: int64 }
        startupDelaySeconds: { type: integer, format: int64 }
        running: { type: boolean }
        currentTrigger: { type: string }
        currentRunStartedAt: { type: string, format: date-time }
        lastRunStartedAt: { type: string, format: date-time }
        lastCompletedAt: { type: string, format: date-time }
        nextScheduledAt: { type: string, format: date-time }
        lastResult: { type: string, enum: [never, success, partial, failed] }
        lastError: { type: string }
        lastActivityProbeAt: { type: string, format: date-time }
        lastActivityProbeError: { type: string }
        activityMode: { type: string, enum: [verified_only] }
    NotificationChannel:
      type: object
      required: [id, kind, name, target, enabled, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [feishu, qq_mail] }
        name: { type: string }
        target: { type: string, description: Masked target summary; credentials are never returned }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NotificationChannelInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [feishu, qq_mail] }
        name: { type: string }
        webhookUrl: { type: string, format: uri }
        sender: { type: string, format: email }
        authCode: { type: string, writeOnly: true }
        recipient: { type: string, format: email }
    NotificationPolicy:
      type: object
      required: [lowQuotaPercent, resetReminderDays, schedulerMinutes, autoActivities]
      properties:
        lowQuotaPercent: { type: integer }
        resetReminderDays:
          type: array
          items: { type: integer }
        schedulerMinutes: { type: integer }
        autoActivities: { type: boolean }
    NotificationEvaluation:
      type: object
      required: [checkedAccounts, triggeredAlerts, deliveredMessages, failedMessages, availableActivities, completedActivities]
      properties:
        checkedAccounts: { type: integer }
        triggeredAlerts: { type: integer }
        deliveredMessages: { type: integer }
        failedMessages: { type: integer }
        availableActivities: { type: integer }
        completedActivities: { type: integer }
    Activity:
      type: object
      required: [id, accountId, accountAlias, providerId, provider, title, description, status, action]
      properties:
        id: { type: string }
        accountId: { type: string }
        accountAlias: { type: string }
        providerId: { type: string }
        provider: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [available, completed, error] }
        action: { type: string }
    Overview:
      type: object
      required: [generatedAt, environment, connection, kpis, tokenTrend, modelUsage, quotaSignals, accounts, alerts]
      properties:
        generatedAt: { type: string, format: date-time }
        environment: { type: string }
        connection: { type: string }
        kpis:
          type: array
          items: { $ref: "#/components/schemas/KPI" }
        tokenTrend:
          type: array
          items: { $ref: "#/components/schemas/DailyUsage" }
        modelUsage:
          type: array
          items: { $ref: "#/components/schemas/ModelUsage" }
        quotaSignals:
          type: array
          items: { $ref: "#/components/schemas/QuotaSignal" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountSummary" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/Alert" }
    KPI:
      type: object
      required: [id, label, value, unit, delta, tone]
      properties:
        id: { type: string }
        label: { type: string }
        value: { type: number }
        unit: { type: string }
        delta: { type: number }
        tone: { type: string }
    DailyUsage:
      type: object
      required: [date, inputTokens, outputTokens, cacheTokens, requests]
      properties:
        date: { type: string, format: date }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheTokens: { type: integer, format: int64 }
        requests: { type: integer, format: int64 }
    ModelUsage:
      type: object
      required: [model, tokens, color]
      properties:
        model: { type: string }
        tokens: { type: integer, format: int64 }
        color: { type: string }
    QuotaSignal:
      type: object
      required: [id, provider, label, kind, value, unit, status, source, confidence]
      properties:
        id: { type: string }
        provider: { type: string }
        label: { type: string }
        kind: { type: string, enum: [quota, credits, balance, rate_window, token_plan] }
        value: { type: number }
        total: { type: number }
        unit: { type: string }
        remainingPercent: { type: number }
        windowSeconds: { type: integer, format: int64 }
        resetAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [healthy, warning, critical] }
        source: { type: string }
        confidence: { type: string }
    AccountSummary:
      type: object
      required: [id, providerId, provider, region, alias, services, primaryMetric, secondaryMetric, status, source, lastRefreshedAt, nextRefreshAt, synthetic, quotaWindows]
      properties:
        id: { type: string }
        providerId: { type: string }
        provider: { type: string }
        region: { type: string }
        alias: { type: string }
        services:
          type: array
          items: { type: string }
        primaryMetric: { type: string }
        secondaryMetric: { type: string }
        status: { type: string }
        source: { type: string }
        lastRefreshedAt: { type: string, format: date-time }
        nextRefreshAt: { type: string, format: date-time }
        error: { type: string }
        email: { type: string }
        plan: { type: string }
        authMethod: { type: string }
        synthetic: { type: boolean }
        quotaWindows:
          type: array
          items: { $ref: "#/components/schemas/QuotaSignal" }
    Alert:
      type: object
      required: [id, severity, title, message, provider, createdAt, recovery]
      properties:
        id: { type: string }
        severity: { type: string }
        title: { type: string }
        message: { type: string }
        provider: { type: string }
        createdAt: { type: string, format: date-time }
        recovery: { type: string }
    Provider:
      type: object
      required: [id, name, region, tier, status, authMethods, capabilities, accountCount, lastCheckedAt, description, category, liveAuth]
      properties:
        id: { type: string }
        name: { type: string }
        region: { type: string }
        tier: { type: string }
        status: { type: string }
        authMethods:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        accountCount: { type: integer }
        lastCheckedAt: { type: string, format: date-time }
        description: { type: string }
        category: { type: string }
        liveAuth: { type: boolean }
    DeviceLoginSession:
      type: object
      required: [id, provider, status, verifyUrl, expiresAt, message]
      properties:
        id: { type: string }
        provider: { type: string }
        status: { type: string, enum: [pending, completed, failed] }
        userCode: { type: string }
        verifyUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        accountId: { type: string }
        message: { type: string }
