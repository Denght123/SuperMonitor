openapi: 3.1.0
info:
  title: SuperMonitor API
  version: 0.1.0
  description: Monitoring-only API. It intentionally exposes no model proxy endpoints.
servers:
  - url: /api/v1
paths:
  /overview:
    get:
      operationId: getOverview
      responses:
        "200":
          description: Current monitoring overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /providers:
    get:
      operationId: listProviders
      responses:
        "200":
          description: Provider adapter status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
  /refresh:
    post:
      operationId: refreshAll
      responses:
        "202":
          description: Refresh completed for the v0.1 synthetic adapters
  /events:
    get:
      operationId: subscribeEvents
      responses:
        "200":
          description: Server-sent event stream
components:
  schemas:
    Overview:
      type: object
      required: [generatedAt, environment, connection, kpis, tokenTrend, modelUsage, quotaSignals, accounts, alerts]
      properties:
        generatedAt: { type: string, format: date-time }
        environment: { type: string }
        connection: { type: string }
        kpis:
          type: array
          items: { $ref: "#/components/schemas/KPI" }
        tokenTrend:
          type: array
          items: { $ref: "#/components/schemas/DailyUsage" }
        modelUsage:
          type: array
          items: { $ref: "#/components/schemas/ModelUsage" }
        quotaSignals:
          type: array
          items: { $ref: "#/components/schemas/QuotaSignal" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountSummary" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/Alert" }
    KPI:
      type: object
      required: [id, label, value, unit, delta, tone]
      properties:
        id: { type: string }
        label: { type: string }
        value: { type: number }
        unit: { type: string }
        delta: { type: number }
        tone: { type: string }
    DailyUsage:
      type: object
      required: [date, inputTokens, outputTokens, cacheTokens, requests]
      properties:
        date: { type: string, format: date }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheTokens: { type: integer, format: int64 }
        requests: { type: integer, format: int64 }
    ModelUsage:
      type: object
      required: [model, tokens, color]
      properties:
        model: { type: string }
        tokens: { type: integer, format: int64 }
        color: { type: string }
    QuotaSignal:
      type: object
      required: [id, provider, label, kind, value, unit, status, source, confidence]
      properties:
        id: { type: string }
        provider: { type: string }
        label: { type: string }
        kind: { type: string, enum: [credits, balance, rate_window, token_plan] }
        value: { type: number }
        total: { type: number }
        unit: { type: string }
        remainingPercent: { type: number }
        resetAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [healthy, warning, critical] }
        source: { type: string }
        confidence: { type: string }
    AccountSummary:
      type: object
      required: [id, provider, region, alias, services, primaryMetric, secondaryMetric, status, source, lastRefreshedAt, nextRefreshAt]
      properties:
        id: { type: string }
        provider: { type: string }
        region: { type: string }
        alias: { type: string }
        services:
          type: array
          items: { type: string }
        primaryMetric: { type: string }
        secondaryMetric: { type: string }
        status: { type: string }
        source: { type: string }
        lastRefreshedAt: { type: string, format: date-time }
        nextRefreshAt: { type: string, format: date-time }
        error: { type: string }
    Alert:
      type: object
      required: [id, severity, title, message, provider, createdAt, recovery]
      properties:
        id: { type: string }
        severity: { type: string }
        title: { type: string }
        message: { type: string }
        provider: { type: string }
        createdAt: { type: string, format: date-time }
        recovery: { type: string }
    Provider:
      type: object
      required: [id, name, region, tier, status, authMethods, capabilities, accountCount, lastCheckedAt]
      properties:
        id: { type: string }
        name: { type: string }
        region: { type: string }
        tier: { type: string }
        status: { type: string }
        authMethods:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        accountCount: { type: integer }
        lastCheckedAt: { type: string, format: date-time }
